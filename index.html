<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信号圈 SIGNAL//ZONE · 和平精英战术地图情报</title>
  <meta name="description" content="信号圈 SIGNAL//ZONE —— 和平精英战术地图情报台：圈形推演、跳点评分、航线拥堵模拟与进圈路线，支持海岛 / 沙漠 / 荣都三大地图。玩家自制，非官方。" />
  <meta name="theme-color" content="#0f1923" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 5 A19 19 0 1 0 24 43' fill='none' stroke='%23FF4655' stroke-width='5'/%3E%3Cpath d='M24 5 A19 19 0 0 1 41 15' fill='none' stroke='%23ECE8E1' stroke-width='5'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%23FF4655'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles-v4.css?v=30" />
</head>

<body>
  <!-- ============================ 启动序列 ============================ -->
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-inner">
      <svg class="boot-mark" viewBox="0 0 48 48" aria-hidden="true">
        <g class="boot-ring" fill="none" stroke="currentColor" stroke-width="2.6">
          <path d="M24 5 A19 19 0 1 0 24 43" />
          <path d="M24 5 A19 19 0 0 1 41 15" stroke="#ECE8E1" />
        </g>
        <circle class="boot-core" cx="24" cy="24" r="4" fill="currentColor" />
      </svg>
      <div class="boot-word">信号圈</div>
      <div class="boot-sub">SIGNAL//ZONE &mdash; ONLINE</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

  <!-- ============================ 顶栏 ============================ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M24 5 A19 19 0 1 0 24 43" fill="none" stroke="#FF4655" stroke-width="5"/>
          <path d="M24 5 A19 19 0 0 1 41 15" fill="none" stroke="#ECE8E1" stroke-width="5"/>
          <circle cx="24" cy="24" r="5" fill="#FF4655"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">信号圈<i>//</i>ZONE</div>
        <div class="brand-sub">SIGNAL ZONE · 战术地图情报 · 非官方</div>
      </div>
    </div>

    <nav class="map-tabs" id="mapTabs" aria-label="地图选择">
      <button class="map-tab active" data-map="island">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5 6 5.5l3 4 2-2.5 3.5 5.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 3.5a1.5 1.5 0 1 0 0 .01" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        海岛
      </button>
      <button class="map-tab" data-map="desert">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="11.5" cy="4.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1 12.5c2-1.6 4-1.6 6 0M6 14.5c2-1.6 4-1.6 6 0M1 14.5c1-0.8 2-0.8 3 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        沙漠
      </button>
      <button class="map-tab" data-map="rongdu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13.5V6l3.5-1v8.5M5.5 8.5l4-1.5v6.5M9.5 13.5V4L14 5v8.5M2 13.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3.5 7.5h1M3.5 9.5h1M11 7h1M11 9h1" stroke="currentColor" stroke-width="1.2"/></svg>
        荣都
      </button>
    </nav>

    <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="模式切换">
      <button data-mode="info" class="active">情报模式</button>
      <button data-mode="game">游戏模式</button>
    </div>

    <button class="ghost-btn" id="clearAll" title="清除航线 / 圈形 / 路线 / 选点">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M12.5 4.5l-.8 8.6a1.2 1.2 0 0 1-1.2 1.1H5.5a1.2 1.2 0 0 1-1.2-1.1L3.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 7v4.5M9.4 7v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      清除标记
    </button>
  </header>

  <!-- ============================ 主工作区 ============================ -->
  <div class="workspace">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 地图区 -->
    <main class="map-area">
      <div class="map-toolbar" id="mapToolbar">
        <button class="tool-btn sidebar-toggle" id="toggleSidebar" aria-controls="sidebar" aria-expanded="true" title="收起侧栏，为地图腾出空间">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 2.5v11M9.5 6l-2 2 2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>收起侧栏</span>
        </button>
        <button class="tool-btn" data-tool="flight" data-game-only title="在地图上点两下：起点 → 终点">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14.5 1.5 7 9M14.5 1.5 9.7 14l-2.2-5.3L2 6.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          航线
        </button>
        <button class="tool-btn" data-game-only onclick="Game.goStep(3)" title="按圈号生成圈形并拖动确认">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r=".8" fill="currentColor"/></svg>
          圈形规划
        </button>
        <button class="tool-btn" data-tool="pin" data-game-only title="点击地图放置大头针">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5S3 9.8 3 6.3a5 5 0 0 1 10 0c0 3.5-5 8.2-5 8.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="6.3" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          大头针
        </button>
        <button class="tool-btn" data-tool="pan" title="按住拖动平移地图（Esc 取消工具）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.8 3.7 8 1.5l2.2 2.2M5.8 12.3 8 14.5l2.2-2.2M3.7 5.8 1.5 8l2.2 2.2M12.3 5.8 14.5 8l-2.2 2.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          拖动
        </button>
        <span class="tb-sep"></span>
        <button class="tool-btn icon-only" id="zoomOut" title="缩小（快捷键 -）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.8 10.8 14.5 14.5M4.8 7h4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <span id="zoomLabel" title="缩放比例">100%</span>
        <button class="tool-btn icon-only" id="zoomIn" title="放大（快捷键 +）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.8 10.8 14.5 14.5M4.8 7h4.4M7 4.8v4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" id="zoomReset" title="重置视图（快捷键 0）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.8 9.5a5.4 5.4 0 1 0 .6-4.8L2 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          重置视图
        </button>
      </div>

      <div class="map-stage" id="mapStage">
        <div class="stage-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="map-viewport" id="mapViewport">
          <img class="map-image" id="mapImage" src="assets/map-island.jpg" alt="海岛地图" />
          <div class="map-tint" aria-hidden="true"></div>
          <svg class="overlay-svg" id="overlaySvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div class="marker-layer" id="markerLayer"></div>
          <svg class="edit-svg" id="editSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        </div>

        <div class="map-hud-title" id="hudMapName">海岛 · Erangel</div>
        <div class="game-hud" id="gameHud"></div>
        <button class="hud-restore" id="hudRestore" onclick="GameHUD.show()">⏱ 显示缩圈提示</button>
        <div class="map-scale" id="mapScale">
          <span class="scale-bar" id="scaleBar"></span>
          <span class="scale-text" id="scaleText">—</span>
        </div>

        <div class="map-legend collapsed" id="mapLegend">
          <div class="lg-row lg-head" onclick="this.parentElement.classList.toggle('collapsed')" title="点击展开 / 收起图例"><b>图例</b><span>LEGEND</span></div>
          <div class="lg-row lg-dots">
            <span><i class="lg-dot" style="background:#f2555a"></i>热 ≥80</span>
            <span><i class="lg-dot" style="background:#fb8c4c"></i>中 65-79</span>
            <span><i class="lg-dot" style="background:#f5c04e"></i>温 50-64</span>
            <span><i class="lg-dot" style="background:#aedd57"></i>凉 40-49</span>
            <span><i class="lg-dot" style="background:#5bd68c"></i>冷 &lt;40</span>
          </div>
          <div class="lg-row">🚗 固定 / 定期载具 · 🚁🐎🦌 特殊载具</div>
          <div class="lg-row">⛰ 反坡 · 🕳 凹坑 · 🌉 桥 · 🚁 绝对高点 · 🏔 相对高点</div>
          <div class="lg-row">🏠 房型 · 🗼 炮楼 · ⛽ 加油站 · 🚪 防空洞 · ⚡ 电塔</div>
          <div class="lg-row">🔐 密室 · 💥 炸药堆 · 🏝 小岛 · 🌊 水边 · 🌲 隐蔽点</div>
          <div class="lg-row" data-maps="rongdu">📡 召唤基站 · 🎁 空投枪必刷点（荣都机制）</div>
          <div class="lg-row" data-maps="island">🛳 轮渡码头（海岛3.0）</div>
        </div>
      </div>
    </main>

    <!-- 检查器 -->
    <aside class="inspector" id="inspector"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============================ 脚本 ============================ -->
  <script src="data-v4.js?v=30"></script>
  <script src="pano.js?v=21"></script>
  <script src="app-core.js?v=30"></script>
  <script src="app-game.js?v=30"></script>
  <script>
    // 地图底图：每次换图淡入（含缓存场景）
    (function () {
      var mi = document.getElementById('mapImage');
      if (mi.complete) mi.classList.add('is-loaded');
      mi.addEventListener('load', function () { mi.classList.add('is-loaded'); });
    })();
    // 启动序列：800ms 后收起并移除
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      setTimeout(function () {
        boot.classList.add('boot-out');
        setTimeout(function () { boot.remove(); }, 450);
      }, 780);
    })();
  </script>
</body>

</html>
